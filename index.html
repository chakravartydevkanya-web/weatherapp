<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="screen">
    <span class="deco sun" aria-hidden="true">☀️</span>
    <span class="deco cloud" aria-hidden="true">☁️</span>
    <div class="app">
      <h1 class="title">Weather App</h1>
      <p class="sub">Check the sky anywhere in the world</p>
      <div class="search">
        <input type="text" placeholder="Type a city name" aria-label="City name">
        <button type="button">Search</button>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
