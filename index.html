<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="screen">
    <span class="deco sun" aria-hidden="true">☀️</span>
    <span class="deco cloud" aria-hidden="true">☁️</span>
    <div class="app">
      <h1 class="title">Weather App</h1>
      <p class="sub">Check the sky anywhere in the world</p>
      <form class="search" id="search-form">
        <input type="text" id="city-input" name="city" placeholder="Type a city name" aria-label="City name">
        <button type="submit">Search</button>
      </form>
      <p class="message" id="message" role="status"></p>
      <section class="card" id="result" hidden>
        <h2 class="city" id="city-name"></h2>
        <p class="time" id="local-time"></p>
        <img class="icon" id="icon" alt="" width="96" height="96">
        <div class="temp" id="temp"></div>
        <p class="desc" id="description"></p>
        <div class="tiles">
          <div class="tile"><span class="ic" aria-hidden="true">🌡️</span><span class="lb">Feels like</span><span class="vl" id="feels-like"></span></div>
          <div class="tile"><span class="ic" aria-hidden="true">💧</span><span class="lb">Humidity</span><span class="vl" id="humidity"></span></div>
          <div class="tile wide"><span class="ic" aria-hidden="true">💨</span><span class="lb">Wind</span><span class="vl" id="wind"></span></div>
        </div>
      </section>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
